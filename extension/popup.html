<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcripto</title>
  <style>
    body { width: 340px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #172033; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { color: #64748b; margin: 0 0 14px; }
    .actions { display: flex; gap: 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
    #start { background: #2563eb; color: white; }
    #stop { background: #e2e8f0; color: #172033; }
    #status { margin: 14px 0 8px; font-weight: 600; }
    #transcript { white-space: pre-wrap; max-height: 260px; overflow: auto; line-height: 1.5; background: #f8fafc; border-radius: 8px; padding: 10px; min-height: 70px; }
    #error { color: #b91c1c; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Transcripto</h1>
  <p>Transcribe audio playing in the current tab.</p>
  <div class="actions">
    <button id="start">Start capture</button>
    <button id="stop" disabled>Stop & transcribe</button>
  </div>
  <div id="status">Ready</div>
  <div id="error"></div>
  <div id="transcript">Your transcript will appear here.</div>
  <script src="popup.js"></script>
</body>
</html>
